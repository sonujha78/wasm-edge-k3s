#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "wasm-echo"
version = "0.1.0"
authors = ["Sonu <sonu@example.com>"]
description = ""

[[trigger.http]]
route = "/..."
component = "wasm-echo"

[component.wasm-echo]
source = "target/wasm32-wasip2/release/wasm_echo.wasm"
allowed_outbound_hosts = []
[component.wasm-echo.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
